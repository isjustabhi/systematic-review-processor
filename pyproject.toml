[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-review-processor"
version = "1.0.0"
description = "Fast parallel PDF processor for systematic reviews using Claude API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Abhiram Varma Nandimandalam", email = "abhiramn@arizona.edu"}]
keywords = ["systematic-review", "pdf", "claude", "anthropic", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "anthropic>=0.28.0",
    "pypdf>=4.0.0",
    "python-docx>=0.8.11",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/your-username/systematic-review-processor"
Repository = "https://github.com/your-username/systematic-review-processor"
Issues = "https://github.com/your-username/systematic-review-processor/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=22.0", "flake8>=4.0"]
